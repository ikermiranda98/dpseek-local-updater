# Comprueba que la traducción automática (GitHub Models) responde, sin compilar
# ni tocar el repositorio: traduce unos textos de prueba en una copia temporal de
# sistema/es-pack.json. A mano: pestaña Actions → "Probar la traducción automática".

name: Probar la traducción automática

on:
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Traducir textos de prueba
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp sistema/es-pack.json "$RUNNER_TEMP/es-pack.json"
          cat > "$RUNNER_TEMP/prueba.json" <<'EOF'
          [
           {"ns": "zzprueba", "key": "a", "text": "Couldn’t open “{path}”. Try again or close this message."},
           {"ns": "zzprueba", "key": "b", "text": "Sources are launch environment, $cwd/.env, then $DSH_HOME/.env."},
           {"ns": "zzprueba", "key": "c", "text": "{count} files changed"}
          ]
          EOF
          DSH_LOCAL_ES_PACK="$RUNNER_TEMP/es-pack.json" node sistema/traduccion/traducir-automatico.mjs "$RUNNER_TEMP/prueba.json" "$RUNNER_TEMP/resumen.md" | tee "$RUNNER_TEMP/salida.txt"
          grep -q '^traducidos=3$' "$RUNNER_TEMP/salida.txt" || { echo "::error::La traducción automática no ha devuelto los 3 textos."; exit 1; }
          node -e "console.log(JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).zzprueba)" "$RUNNER_TEMP/es-pack.json"
          cat "$RUNNER_TEMP/resumen.md" >> "$GITHUB_STEP_SUMMARY"
